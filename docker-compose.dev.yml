# Local development database for Halyard.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: halyard
      POSTGRES_PASSWORD: halyard
      POSTGRES_DB: halyard
    ports:
      - "5432:5432"
    volumes:
      - halyard-dev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halyard -d halyard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  halyard-dev-db: {}
