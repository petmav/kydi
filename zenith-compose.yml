services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://kydi:kydi-preview-db-pw@db:5432/kydi?schema=public"
      SESSION_SECRET: "kydi-preview-only-session-secret-7f3c9a1e5b2d4f60"
      CRON_SECRET: "kydi-preview-cron-secret"
      UPLOAD_DIR: "/data/uploads"
      KYDI_DEMO_SEED: "true"
      SMTP_FROM: "Kydi <no-reply@kydi.local>"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app-data:/data
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kydi
      POSTGRES_PASSWORD: kydi-preview-db-pw
      POSTGRES_DB: kydi
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kydi -d kydi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app-data: {}
  db-data: {}

x-zenith:
  catalog:
    name: Kydi
    description: >-
      Self-hosted invoicing for freelancers and small businesses: customers, items,
      estimates, invoices, recurring billing, payments, expenses, reports, PDF
      generation, email delivery and a customer portal.
    authors: ["pmavr"]
    tags: [invoicing, finance, business, saas]
    source: https://github.com/petmav/kydi
    license: MIT
  expose:
    - service: app
      port: 3000
      web: true
